<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main role="main">
    <section class="container" style="max-width: 500px; margin-top: 40px;">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h3>Sign In</h3>
                <p class="text-muted">Select your account to continue</p>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

        <form method="POST" th:action="@{/login}">
            <div class="form-group cymbal-form-field mb-3">
                <label for="email">User Account</label>
                <select name="email" id="email" class="form-control" style="height: 44px; font-size: 14px;">
                    <option th:each="u : ${users}"
                            th:value="${u.email()}"
                            th:text="${u.fullName() + ' (' + u.email() + ')'}">user</option>
                </select>
            </div>

            <div class="form-group cymbal-form-field mb-4">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                       value="password" required style="height: 44px; font-size: 14px;">
            </div>

            <div class="text-center">
                <button type="submit" class="cymbal-button-primary">Sign In</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
