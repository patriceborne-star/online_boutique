<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{header :: head}"></head>
    <body>
        <header th:replace="~{header :: navbar}"></header>

        <main role="main">
            <section
                class="container"
                style="max-width: 900px; margin-top: 30px"
            >
                <div class="row mb-3">
                    <div class="col-12">
                        <h3>Order History</h3>
                    </div>
                </div>

                <!-- Summary stats -->
                <div
                    th:if="${summary_order_count != null && summary_order_count > 0}"
                    class="row mb-4 p-3"
                    style="background: #f8f9fa; border-radius: 8px"
                >
                    <div class="col-md-3 text-center">
                        <strong th:text="${summary_order_count}">0</strong
                        ><br />
                        <small class="text-muted">Total Orders</small>
                    </div>
                    <div class="col-md-3 text-center">
                        <strong th:text="'$' + ${summary_total_spent}"
                            >$0</strong
                        ><br />
                        <small class="text-muted">Total Spent</small>
                    </div>
                    <div class="col-md-3 text-center">
                        <strong th:text="${summary_unique_products}">0</strong
                        ><br />
                        <small class="text-muted">Unique Products</small>
                    </div>
                    <div class="col-md-3 text-center">
                        <strong th:text="${summary_name}">Name</strong><br />
                        <small class="text-muted">Account</small>
                    </div>
                </div>

                <!-- No orders -->
                <div th:if="${#lists.isEmpty(orders)}" class="text-center mt-5">
                    <h4>No orders yet</h4>
                    <p class="text-muted">
                        Items you purchase will appear here.
                    </p>
                    <a
                        class="cymbal-button-primary"
                        th:href="@{/}"
                        role="button"
                        >Start Shopping</a
                    >
                </div>

                <!-- Orders list -->
                <div
                    th:each="order : ${orders}"
                    class="mb-4 p-3"
                    style="border: 1px solid #dee2e6; border-radius: 8px"
                >
                    <div class="row mb-2">
                        <div class="col-md-4">
                            <strong>Order #</strong><br />
                            <small
                                th:text="${order.orderId()}"
                                style="word-break: break-all"
                                >ID</small
                            >
                        </div>
                        <div class="col-md-3">
                            <strong>Date</strong><br />
                            <small th:text="${order.createdAt()}">date</small>
                        </div>
                        <div class="col-md-2">
                            <strong>Status</strong><br />
                            <span
                                th:text="${order.statusLabel()}"
                                th:style="${order.status() == 'delivered' ? 'color: green; font-weight: bold;' : order.status() == 'shipped' ? 'color: blue; font-weight: bold;' : 'color: orange; font-weight: bold;'}"
                                >Status</span
                            >
                        </div>
                        <div class="col-md-3 text-right">
                            <strong>Total</strong><br />
                            <span th:text="${order.totalPaid().render()}"
                                >$0.00</span
                            >
                        </div>
                    </div>

                    <!-- Order items -->
                    <div
                        th:if="${order.items() != null && !order.items().isEmpty()}"
                        class="mt-2"
                    >
                        <div
                            th:each="item : ${order.items()}"
                            class="row ml-2"
                            style="font-size: 0.9em"
                        >
                            <div class="col-md-6">
                                <span th:text="${item.productId()}"
                                    >product</span
                                >
                                x <span th:text="${item.quantity()}">1</span>
                            </div>
                            <div class="col-md-6 text-right">
                                <span th:text="${item.cost().render()}"
                                    >$0.00</span
                                >
                            </div>
                        </div>
                        <div class="row ml-2" style="font-size: 0.9em">
                            <div class="col-md-6"><em>Shipping</em></div>
                            <div class="col-md-6 text-right">
                                <span th:text="${order.shippingCost().render()}"
                                    >$0.00</span
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Tracking info -->
                    <div
                        class="row mt-2 ml-2"
                        style="font-size: 0.85em; color: #666"
                    >
                        <div class="col">
                            Tracking:
                            <span th:text="${order.shippingTrackingId()}"
                                >TRACK</span
                            >
                            <span th:if="${order.shippedAt() != null}">
                                &mdash; Shipped:
                                <span th:text="${order.shippedAt()}">date</span>
                            </span>
                            <span th:if="${order.deliveredAt() != null}">
                                &mdash; Delivered:
                                <span th:text="${order.deliveredAt()}"
                                    >date</span
                                >
                            </span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer th:replace="~{footer :: footer}"></footer>
    </body>
</html>
