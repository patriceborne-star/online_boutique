<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main role="main" class="home">
    <div class="home-mobile-hero-banner d-lg-none"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-lg-12 px-10-percent">
                <div class="row hot-products-row px-xl-6">
                    <div class="col-12">
                        <h3>Hot Products</h3>
                    </div>

                    <div class="col-md-4 hot-product-card" th:each="pv : ${products}">
                        <a th:href="@{/product/{id}(id=${pv.item().id()})}">
                            <img loading="lazy" th:src="@{${pv.item().picture()}}">
                            <div class="hot-product-card-img-overlay"></div>
                        </a>
                        <div>
                            <div class="hot-product-card-name" th:text="${pv.item().name()}">Product</div>
                            <div class="hot-product-card-price" th:text="${pv.renderedPrice()}">$0.00</div>
                        </div>
                    </div>
                </div>

                <div class="row d-none d-lg-block home-desktop-footer-row">
                    <div class="col-12 p-0">
                        <footer th:replace="~{footer :: footer}"></footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="d-lg-none">
    <footer th:replace="~{footer :: footer}"></footer>
</div>
</body>
</html>
