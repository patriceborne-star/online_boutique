<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main role="main" class="order">
    <section class="container order-complete-section">
        <div class="row">
            <div class="col-12 text-center">
                <h3>Your order is complete!</h3>
            </div>
            <div class="col-12 text-center">
                <p>We've sent you a confirmation email.</p>
            </div>
        </div>
        <div class="row border-bottom-solid padding-y-24">
            <div class="col-6 pl-md-0">Confirmation #</div>
            <div class="col-6 pr-md-0 text-right" th:text="${order.orderId()}">ORDER-ID</div>
        </div>
        <div class="row border-bottom-solid padding-y-24">
            <div class="col-6 pl-md-0">Tracking #</div>
            <div class="col-6 pr-md-0 text-right" th:text="${order.shippingTrackingId()}">TRACK-ID</div>
        </div>
        <div class="row padding-y-24">
            <div class="col-6 pl-md-0">Total Paid</div>
            <div class="col-6 pr-md-0 text-right" th:text="${total_paid.render()}">$0.00</div>
        </div>
        <div class="row">
            <div class="col-12 text-center">
                <a class="cymbal-button-primary" th:href="@{/}" role="button">Continue Shopping</a>
            </div>
        </div>
    </section>

    <div th:if="${recommendations != null && !recommendations.isEmpty()}">
        <div th:replace="~{recommendations :: recommendations}"></div>
    </div>
</main>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
