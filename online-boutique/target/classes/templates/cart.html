<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{header :: head}"></head>
    <body>
        <header th:replace="~{header :: navbar}"></header>

        <main role="main" class="cart-sections">
            <!-- Empty cart -->
            <section
                class="empty-cart-section"
                th:if="${#lists.isEmpty(items)}"
            >
                <h3>Your shopping cart is empty!</h3>
                <p>Items you add to your shopping cart will appear here.</p>
                <a class="cymbal-button-primary" th:href="@{/}" role="button"
                    >Continue Shopping</a
                >
            </section>

            <!-- Cart with items -->
            <section class="container" th:if="${!#lists.isEmpty(items)}">
                <div class="row">
                    <div
                        class="col-lg-6 col-xl-5 offset-xl-1 cart-summary-section"
                    >
                        <div class="row mb-3 py-2">
                            <div class="col-4 pl-md-0">
                                <h3>
                                    Cart (<span th:text="${cart_size}">0</span>)
                                </h3>
                            </div>
                            <div class="col-8 pr-md-0 text-right">
                                <form method="POST" th:action="@{/cart/empty}">
                                    <button
                                        class="cymbal-button-secondary cart-summary-empty-cart-button"
                                        type="submit"
                                    >
                                        Empty Cart
                                    </button>
                                    <a
                                        class="cymbal-button-primary"
                                        th:href="@{/}"
                                        role="button"
                                    >
                                        Continue Shopping
                                    </a>
                                </form>
                            </div>
                        </div>

                        <div
                            class="row cart-summary-item-row"
                            th:each="ci : ${items}"
                        >
                            <div class="col-md-4 pl-md-0">
                                <a
                                    th:href="@{/product/{id}(id=${ci.item().id()})}"
                                >
                                    <img
                                        class="img-fluid"
                                        alt=""
                                        th:src="@{${ci.item().picture()}}"
                                    />
                                </a>
                            </div>
                            <div class="col-md-8 pr-md-0">
                                <div class="row">
                                    <div class="col">
                                        <h4 th:text="${ci.item().name()}">
                                            Product
                                        </h4>
                                    </div>
                                </div>
                                <div
                                    class="row cart-summary-item-row-item-id-row"
                                >
                                    <div class="col">
                                        SKU #<span th:text="${ci.item().id()}"
                                            >ID</span
                                        >
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        Quantity:
                                        <span th:text="${ci.quantity()}"
                                            >1</span
                                        >
                                    </div>
                                    <div class="col pr-md-0 text-right">
                                        <strong th:text="${ci.renderedPrice()}"
                                            >$0.00</strong
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row cart-summary-shipping-row">
                            <div class="col pl-md-0">Shipping</div>
                            <div
                                class="col pr-md-0 text-right"
                                th:text="${shipping_cost.render()}"
                            >
                                $0.00
                            </div>
                        </div>

                        <div class="row cart-summary-total-row">
                            <div class="col pl-md-0">Total</div>
                            <div
                                class="col pr-md-0 text-right"
                                th:text="${total_cost.render()}"
                            >
                                $0.00
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5 offset-lg-1 col-xl-4">
                        <form
                            class="cart-checkout-form"
                            th:action="@{/cart/checkout}"
                            method="POST"
                        >
                            <div class="row">
                                <div class="col"><h3>Shipping Address</h3></div>
                            </div>

                            <div class="form-row">
                                <div class="col cymbal-form-field">
                                    <label for="email">E-mail Address</label>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        th:value="${prefill_user != null ? prefill_user.email() : 'someone@example.com'}"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col cymbal-form-field">
                                    <label for="street_address"
                                        >Street Address</label
                                    >
                                    <input
                                        type="text"
                                        name="street_address"
                                        id="street_address"
                                        th:value="${prefill_user != null ? prefill_user.streetAddress() : '1600 Amphitheatre Parkway'}"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col cymbal-form-field">
                                    <label for="zip_code">Zip Code</label>
                                    <input
                                        type="text"
                                        name="zip_code"
                                        id="zip_code"
                                        th:value="${prefill_user != null ? prefill_user.zipCode() : '94043'}"
                                        required
                                        pattern="\d{4,5}"
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col cymbal-form-field">
                                    <label for="city">City</label>
                                    <input
                                        type="text"
                                        name="city"
                                        id="city"
                                        th:value="${prefill_user != null ? prefill_user.city() : 'Mountain View'}"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col-md-5 cymbal-form-field">
                                    <label for="state">State</label>
                                    <input
                                        type="text"
                                        name="state"
                                        id="state"
                                        th:value="${prefill_user != null ? prefill_user.state() : 'CA'}"
                                        required
                                    />
                                </div>
                                <div class="col-md-7 cymbal-form-field">
                                    <label for="country">Country</label>
                                    <input
                                        type="text"
                                        id="country"
                                        name="country"
                                        th:value="${prefill_user != null ? prefill_user.country() : 'United States'}"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="row">
                                <div class="col">
                                    <h3 class="payment-method-heading">
                                        Payment Method
                                    </h3>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col cymbal-form-field">
                                    <label for="credit_card_number"
                                        >Credit Card Number</label
                                    >
                                    <input
                                        type="text"
                                        id="credit_card_number"
                                        name="credit_card_number"
                                        placeholder="0000000000000000"
                                        th:value="${prefill_user != null ? prefill_user.creditCardNumber() : '4432801561520454'}"
                                        required
                                        pattern="\d{16}"
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="col-md-5 cymbal-form-field">
                                    <label for="credit_card_expiration_month"
                                        >Month</label
                                    >
                                    <select
                                        name="credit_card_expiration_month"
                                        id="credit_card_expiration_month"
                                    >
                                        <option
                                            value="1"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 1 : false}"
                                        >
                                            January
                                        </option>
                                        <option
                                            value="2"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 2 : false}"
                                        >
                                            February
                                        </option>
                                        <option
                                            value="3"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 3 : false}"
                                        >
                                            March
                                        </option>
                                        <option
                                            value="4"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 4 : false}"
                                        >
                                            April
                                        </option>
                                        <option
                                            value="5"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 5 : false}"
                                        >
                                            May
                                        </option>
                                        <option
                                            value="6"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 6 : false}"
                                        >
                                            June
                                        </option>
                                        <option
                                            value="7"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 7 : false}"
                                        >
                                            July
                                        </option>
                                        <option
                                            value="8"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 8 : false}"
                                        >
                                            August
                                        </option>
                                        <option
                                            value="9"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 9 : false}"
                                        >
                                            September
                                        </option>
                                        <option
                                            value="10"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 10 : false}"
                                        >
                                            October
                                        </option>
                                        <option
                                            value="11"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 11 : false}"
                                        >
                                            November
                                        </option>
                                        <option
                                            value="12"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpMonth() == 12 : false}"
                                        >
                                            December
                                        </option>
                                    </select>
                                    <img
                                        th:src="@{/static/icons/Hipster_DownArrow.svg}"
                                        alt=""
                                        class="cymbal-dropdown-chevron"
                                    />
                                </div>
                                <div class="col-md-4 cymbal-form-field">
                                    <label for="credit_card_expiration_year"
                                        >Year</label
                                    >
                                    <select
                                        name="credit_card_expiration_year"
                                        id="credit_card_expiration_year"
                                    >
                                        <option
                                            th:each="y, stat : ${expiration_years}"
                                            th:value="${y}"
                                            th:text="${y}"
                                            th:selected="${prefill_user != null ? prefill_user.creditCardExpYear() == y : stat.index == 1}"
                                        >
                                            2026
                                        </option>
                                    </select>
                                    <img
                                        th:src="@{/static/icons/Hipster_DownArrow.svg}"
                                        alt=""
                                        class="cymbal-dropdown-chevron"
                                    />
                                </div>
                                <div class="col-md-3 cymbal-form-field">
                                    <label for="credit_card_cvv">CVV</label>
                                    <input
                                        type="password"
                                        id="credit_card_cvv"
                                        name="credit_card_cvv"
                                        th:value="${prefill_user != null ? prefill_user.creditCardCvv() : '672'}"
                                        required
                                        pattern="\d{3}"
                                    />
                                </div>
                            </div>

                            <div class="form-row justify-content-center">
                                <div class="col text-center">
                                    <button
                                        class="cymbal-button-primary"
                                        type="submit"
                                    >
                                        Place Order
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <div
                th:if="${recommendations != null && !recommendations.isEmpty()}"
            >
                <div th:replace="~{recommendations :: recommendations}"></div>
            </div>
        </main>

        <footer th:replace="~{footer :: footer}"></footer>
    </body>
</html>
