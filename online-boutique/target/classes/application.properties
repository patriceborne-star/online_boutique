# Database connection — overridden at runtime from properties.ini
spring.datasource.url=jdbc:postgresql://localhost:5433/my_db41
spring.datasource.username=yugabyte
spring.datasource.password=

# DB init is handled by the bash runner script (60 - Run web app.sh)
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false

# Serve static resources at /static/** to match original template paths
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# Server port — read from APPLICATION_PORT in properties.ini at startup
# This default is used only if properties.ini does not specify APPLICATION_PORT
server.port=8080
